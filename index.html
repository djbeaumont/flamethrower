<!doctype html>
<html lang="en-US">
<head>
  <meta charset="utf-8" />
  <title>hello-wasm example</title>
  <style>
    html, body {
        background-color: #49483E;
        color: #EEE;
        font-family: system-ui;
    }
    .panel {
        margin-bottom: 1rem;
    }
    .field {
      display: flex;
      flex-direction: column;
      margin-bottom: 0.5rem;
    }
    .timing-form {
        margin: 1rem 0;
        width: 30rem;
    }
    .button {
        margin-bottom: 1rem;
    }
  </style>
</head>
<body>

<script type="module">
  import { html, render, Component } from "https://unpkg.com/htm/preact/standalone.module.js"
  import init, { greet, between } from "./pkg/flamethrower.js";

  await init();

  class Header extends Component {
    render() {
      return html`<h1>${greet("foobar")}</h1>`;
    }
  }

  class InputField extends Component {
    render({ name, label, value, onChange }) {
      return html`
        <div class="field">
          <label for=${name}>${label}</label>
          <input
              type="text"
              value=${value}
              onChange=${e => onChange(e.target.value)}
          />
        </div>
      `;
    }
  }

  class SelectField extends Component {
    render({ name, label, value, onChange, options }) {
      return html`
        <div class="field">
          <label for=${name}>${label}</label>
          <select name=${name} onChange=${e => onChange(e.target.value)}>
            ${Object.keys(options).map(option => html`
              <option value=${option} selected=${option === value ? "selected" : undefined}>
                ${options[option]}
              </option>
            `)}
          </select>
        </div>
      `;
    }
  }

  class TimingForm extends Component {
    constructor({ value }) {
      super();
      this.state = this.getDerivedStateFromProps(value);
    }

    getDerivedStateFromProps(nextProps, prevState) {
      return {
        frequency: nextProps.repeat.frequency.toString(),
        period: nextProps.repeat.period.toString(),
        periodUnit: nextProps.repeat.periodUnit,
      }
    }

    onChange(props, state, name, val) {
      const newState = { ...state, [name]: val };
      this.setState(newState);
      // TODO - better serialisation of the flat form values into a FHIR timing object
      const newTiming = {
        repeat: {
          frequency: Number.parseInt(newState.frequency),
          period: Number.parseInt(newState.period),
          periodUnit: newState.periodUnit,
        },
      };
      props.onChange?.(newTiming);
    }

    render(props, state) {
      return html`
        <div class="panel timing-form">
          <${InputField}
            name="frequency"
            label="Frequency"
            value=${this.state.frequency}
            onChange=${val => this.onChange(props, state, 'frequency', val)}
          />
          <${InputField}
            name="period"
            label="Period"
            value=${this.state.period}
            onChange=${val => this.onChange(props, state, 'period', val)}
          />
          <${SelectField}
              name="periodUnit"
              label="Period unit"
              value=${this.state.periodUnit}
              onChange=${val => this.onChange(props, state, 'periodUnit', val)}
              options=${{h: 'Hours', d: 'Days', wk: 'Weeks' }}
          />
          <button class="button" type="reset">Reset</button>
        </div>
      `;
    }
  }

  class TimingDisplay extends Component {
    render({ value }) {
      return html`
        <div class="panel">
          <pre>
            ${JSON.stringify(value, null, 2)}
          </pre>
        </div>
      `;
    }
  }

  class OccurrencesDisplay extends Component {
    render() {
      const occurrences = between('2024-01-01', '2024-02-01');
      return html`
        <div class="panel">
          <pre>
            ${JSON.stringify(occurrences, null, 2)}
          </pre>
        </div>
      `;
    }
  }

  class App extends Component {
    constructor() {
      super();
      const initialState = {
        timing: {
          repeat: {
            frequency: 1,
            period: 1,
            periodUnit: 'd',
          }
        }
      }
      this.state = initialState;
    }

    render() {
      return html`
        <${Header}/>
        <${TimingForm} value=${this.state.timing} onChange=${timing => this.setState({ timing  })} />
        <${TimingDisplay} value=${this.state.timing} />
        <${OccurrencesDisplay} />
      `;
    }
  }

  render(html`<${App} />`, document.body);
</script>

</body>
</html>
