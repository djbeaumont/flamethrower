<!doctype html>
<html lang="en-US">
<head>
  <meta charset="utf-8" />
  <title>flamethrower: projection of recurring FHIR timing structures</title>
  <style>
    html, body {
        background-color: #49483E;
        color: #EEE;
        font-family: system-ui;
    }
    .panel {
        margin-bottom: 1rem;
    }
    .field {
      display: flex;
      flex-direction: column;
      margin-bottom: 0.5rem;
    }
    .timing-form {
        margin: 1rem 0;
        width: 30rem;
    }
    .button {
        margin-bottom: 1rem;
    }
  </style>
</head>
<body>

<script type="module">
  import { html, render, Component } from "https://unpkg.com/htm/preact/standalone.module.js"
  import init, { project_occurrences } from "./pkg/flamethrower.js";

  await init();

  class Heading extends Component {
    render({ as, children }) {
      return html`<${as}>${children}<//>`;
    }
  }

  class InputField extends Component {
    render({ name, label, value, onChange }) {
      return html`
        <div class="field">
          <label for=${name}>${label}</label>
          <input
              type="text"
              value=${value}
              onChange=${e => onChange(e.target.value)}
          />
        </div>
      `;
    }
  }

  class SelectField extends Component {
    render({ name, label, value, onChange, options }) {
      return html`
        <div class="field">
          <label for=${name}>${label}</label>
          <select name=${name} onChange=${e => onChange(e.target.value)}>
            ${Object.keys(options).map(option => html`
              <option value=${option} selected=${option === value ? "selected" : undefined}>
                ${options[option]}
              </option>
            `)}
          </select>
        </div>
      `;
    }
  }

  class TimingForm extends Component {
    constructor({ value }) {
      super();
      this.state = this.getDerivedStateFromProps(value);
    }

    getDerivedStateFromProps(nextProps, prevState) {
      return {
        frequency: nextProps.repeat.frequency.toString(),
        period: nextProps.repeat.period.toString(),
        periodUnit: nextProps.repeat.periodUnit,
      }
    }

    onChange(props, state, name, val) {
      const newState = { ...state, [name]: val };
      this.setState(newState);
      // TODO - better serialisation of the flat form values into a FHIR timing object
      const newTiming = {
        repeat: {
          frequency: Number.parseInt(newState.frequency),
          period: Number.parseInt(newState.period),
          periodUnit: newState.periodUnit,
        },
      };
      props.onChange?.(newTiming);
    }

    render(props, state) {
      return html`
        <div class="panel timing-form">
          <${Heading} as="h2">1. Enter timing details</>
          <${InputField}
            name="frequency"
            label="Frequency"
            value=${this.state.frequency}
            onChange=${val => this.onChange(props, state, 'frequency', val)}
          />
          <${InputField}
            name="period"
            label="Period"
            value=${this.state.period}
            onChange=${val => this.onChange(props, state, 'period', val)}
          />
          <${SelectField}
              name="periodUnit"
              label="Period unit"
              value=${this.state.periodUnit}
              onChange=${val => this.onChange(props, state, 'periodUnit', val)}
              options=${{h: 'Hours', d: 'Days', wk: 'Weeks' }}
          />
          <button class="button" type="reset">Reset</button>
        </div>
      `;
    }
  }

  class TimingDisplay extends Component {
    render({ value }) {
      return html`
        <div class="panel">
          <${Heading} as="h2">2. Review generated FHIR timing</${Heading}>
          <pre>
            ${JSON.stringify(value, null, 2)}
          </pre>
        </div>
      `;
    }
  }

  class ProjectWindowForm extends Component {
    render({ projectionStart, projectionEnd, onChange }) {
      return html`
        <div class="panel timing-form">
          <${Heading} as="h2">3. Enter projection window</>
          <${InputField}
            name="start"
            label="Start date"
            value=${projectionStart}
            onChange=${val => onChange(val, projectionEnd)}
          />
          <${InputField}
            name="end"
            label="End date"
            value=${projectionEnd}
            onChange=${val => onChange(projectionStart, val)}
          />
        </div>
      `;
    }
  }

  class OccurrencesDisplay extends Component {
    render({ value }) {
      return html`
        <div class="panel">
          <${Heading} as="h2">4. Project occurrences</${Heading}>
          <pre>
            ${JSON.stringify(value, null, 2)}
          </pre>
        </div>
      `;
    }
  }

  class App extends Component {
    constructor() {
      super();

      const initialTiming = {
        repeat: {
          bounds: {
            start: '2024-01-01',
            end: '2025-02-01',
          },
          frequency: 1,
          period: 1,
          period_unit: 'd',
          day_of_week: [],
          time_of_day: [],
          when: [],
        }
      };

      const initialProjectionStart = '2024-03-01';
      const initialProjectionEnd = '2024-04-01';

      const initialOccurrences = project_occurrences(initialTiming, initialProjectionStart, initialProjectionEnd);

      this.state = {
        timing: initialTiming,
        occurrences: initialOccurrences,
        projectionStart: initialProjectionStart,
        projectionEnd: initialProjectionEnd,
      };
    }

    onUpdateTiming(timing) {
      const occurrences = project_occurrences(timing, this.state.projectionStart, this.state.projectionEnd);
      this.setState({ timing: timing, occurrences: occurrences });
    }

    onUpdateProjectionWindow(projectionStart, projectionEnd) {
      const occurrences = project_occurrences(this.state.timing, projectionStart, projectionEnd)
      this.setState({ occurrences, projectionStart, projectionEnd });
    }

    render() {
      return html`
        <${Heading} as="h1">FHIR Timing Projector</>
        <${TimingForm} value=${this.state.timing} onChange=${this.onUpdateTiming} />
        <${TimingDisplay} value=${this.state.timing} />
        <${ProjectWindowForm}
            projectionStart=${this.state.projectionStart}
            projectionEnd=${this.state.projectionEnd}
            onChange=${(start, end) => this.onUpdateProjectionWindow(start, end)}
        />
        <${OccurrencesDisplay} value=${this.state.occurrences} />
      `;
    }
  }

  render(html`<${App} />`, document.body);
</script>

</body>
</html>
