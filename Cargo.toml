[package]
name = "flamethrower"
version = "0.1.0"
authors = ["David Beaumont <david@zorq.net>"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
chrono = { version = "0.4.41", features = ["serde"] }
chrono-tz = { version = "0.10.4" }
fhir-rs = { git = "https://github.com/ocrickard/fhir-rs" }
rrule = "0.14.0"
serde = { version = "1.0.219", features = ["derive"] }

[dev-dependencies]
serde_json = "1.0.140"
