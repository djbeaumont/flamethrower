[package]
name = "flamethrower"
version = "0.1.0"
authors = ["David Beaumont <david@zorq.net>"]
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
chrono = { version = "0.4.41", features = ["serde", "wasmbind"] }
chrono-tz = { version = "0.10.4" }
fhir-rs = { git = "https://github.com/ocrickard/fhir-rs" }
rrule = "0.14.0"
serde = { version = "1.0.219", features = ["derive"] }
serde-wasm-bindgen = "0.6.5"
wasm-bindgen = "0.2"

[dev-dependencies]
serde_json = "1.0.140"
